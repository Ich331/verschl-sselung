<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffre-Übersetzer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; background: #2c2c2c; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; resize: none; margin-bottom: 20px; }
        .output { background: #121212; padding: 15px; border-left: 4px solid #007acc; min-height: 50px; word-wrap: break-word; white-space: pre-wrap; font-size: 1.2em; }
        h2 { color: #007acc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Chiffre-Übersetzer</h2>
    <p>Gib deinen Text ein – die Übersetzung erfolgt live:</p>
    
    <textarea id="input" placeholder="Hier tippen..."></textarea>
    
    <div class="output" id="output">...</div>
</div>

<script>
    const map = {
        'A': 'ä', 'B': '1', 'C': '2', 'D': '3', 'E': '4', 'F': '5', 'G': '6', 'H': '7', 'I': 'イ', 'J': '9', 'K': '!', 'L': '+', 'M': ':',
        'N': '-', 'O': 'ö', 'P': '#', 'Q': "'", 'R': '?', 'S': 'ß', 'T': ',', 'U': 'ü', 'V': ';', 'W': '·', 'X': '8', 'Y': '↓', 'Z': '√'
    };

    const inputArea = document.getElementById('input');
    const outputDiv = document.getElementById('output');

    inputArea.addEventListener('input', () => {
        const text = inputArea.value.toUpperCase();
        let result = "";

        for (let char of text) {
            result += map[char] || char;
        }

        outputDiv.innerText = result || "...";
    });
</script>

</body>
</html>
